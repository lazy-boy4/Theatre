version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  wakelock_plus: ^1.2.9
  path_provider: ^2.1.4
  intl: ^0.19.0
  async: ^2.11.0
  rxdart: ^0.27.7
  flutter_rust_bridge: 2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.7
  flutter_lints: ^4.0.0
  build_runner: ^2.5.0
  freezed: ^3.2.5
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
