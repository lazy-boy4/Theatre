name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  release:
    name: Draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # TODO: add artifact-upload jobs (Windows installer, Linux AppImage, Android APKs)
  # per architecture §20 — added as part of M5 release pipeline task.
