name: CI

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Rust matrix (Linux, Windows, macOS portability guard) ────
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }

      - name: fmt
        working-directory: core
        run: cargo fmt --check

      - name: clippy
        working-directory: core
        run: cargo clippy --workspace --all-targets --all-features --locked

      - name: test (unit + security)
        working-directory: core
        run: cargo test --workspace --locked -- --nocapture

      - name: test (doc)
        working-directory: core
        run: cargo test --doc --locked

  # ── Security audit ──────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        working-directory: core
        run: cargo audit

  # ── Benchmarks (comment P50/P99 on PR) ─────────────────────
  bench:
    name: Benchmarks
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - name: Run benchmarks
        working-directory: core
        run: cargo bench -p theatre-core -- --output-format bencher | tee bench_output.txt
      - name: Comment benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: cargo
          output-file-path: core/bench_output.txt
          fail-on-alert: true
          alert-threshold: '130%'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-on-alert: true

  # ── Flutter (analyzer, formatter, unit tests) ───────────────
  flutter:
    name: Flutter
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: dart format --set-exit-if-changed lib/ test/
      - run: flutter test

  # ── Android build (cargo-ndk x3 ABIs + APK) ──────────────────
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    needs: [rust, flutter]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android }
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Rust core for Android (3 ABIs)
        working-directory: core
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o ../app/android/app/src/main/jniLibs build --release --locked -p theatre-ffi
      - name: Flutter build APK
        working-directory: app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Theatre-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  # ── Linux desktop ─────────────────────────────────────────
  linux:
    name: Linux Desktop
    runs-on: ubuntu-24.04
    needs: [rust, flutter]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang ninja-build pkg-config libgtk-3-dev libasound2-dev libmpv-dev mpv
      - name: Build Rust core
        working-directory: core
        run: cargo build --release --locked -p theatre-ffi
      - name: Flutter build Linux
        working-directory: app
        run: flutter build linux --release
      - name: Bundle libtheatre_ffi.so
        run: cp core/target/release/libtheatre_ffi.so app/build/linux/x64/release/bundle/lib/
      - uses: actions/upload-artifact@v4
        with:
          name: Theatre-linux
          path: app/build/linux/x64/release/bundle/

  # ── Windows desktop ───────────────────────────────────────
  windows:
    name: Windows Desktop
    runs-on: windows-2022
    needs: [rust, flutter]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Rust core
        working-directory: core
        run: cargo build --release --locked -p theatre-ffi
      - name: Flutter build Windows
        working-directory: app
        run: flutter build windows --release
      - name: Bundle theatre_ffi.dll
        run: copy core\target\release\theatre_ffi.dll app\build\windows\x64\runner\Release\
      - uses: actions/upload-artifact@v4
        with:
          name: Theatre-windows
          path: app/build/windows/x64/runner/Release/
